# Nixpacks config — Python app + Chromium (para Playwright/Mercadona)
#
# IMPORTANTE: al declarar [phases.setup].nixPkgs se REEMPLAZAN los paquetes que
# nixpacks añade por defecto, así que hay que incluir python + pip explícitamente
# y crear el venv en /opt/venv (nixpacks ya añade /opt/venv/bin al PATH vía
# .profile). Si no se crea el venv → "pip: command not found".

[phases.setup]
nixPkgs = [
  "python312",
  "python312Packages.pip",
  "gcc",
  # Chromium + dependencias de sistema para Playwright headless
  "chromium",
  "nss",
  "nspr",
  "cups",
  "dbus",
  "libdrm",
  "libxkbcommon",
  "pango",
  "cairo",
  "glib",
  "gtk3",
  "alsa-lib",
  "xorg.libX11",
  "xorg.libXcomposite",
  "xorg.libXdamage",
  "xorg.libXext",
  "xorg.libXfixes",
  "xorg.libXrandr",
  "xorg.libxcb",
]

[phases.install]
cmds = [
  "python -m venv --copies /opt/venv",
  ". /opt/venv/bin/activate && pip install --upgrade pip && pip install -r requirements.txt",
  # Chromium propio de Playwright + sus dependencias de sistema (vía apt).
  # --with-deps instala las libs Ubuntu que el build de Playwright necesita
  # (las de nix no están en las rutas estándar que espera).
  ". /opt/venv/bin/activate && python -m playwright install --with-deps chromium",
]

# El comando de arranque real viene de railway.toml.
# gunicorn se encuentra porque /opt/venv/bin está en el PATH.
