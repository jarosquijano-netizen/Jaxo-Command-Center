[build]
# Dockerfile con la imagen oficial de Playwright (Chromium + deps ya listos).
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# El comando de arranque viene del CMD del Dockerfile (usa `sh -c`, así que
# `cd backend && gunicorn ...` funciona). NO poner startCommand aquí: Railway
# lo ejecuta sin shell y `cd` falla ("executable cd could not be found").
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[environment]
FLASK_ENV = "production"
FLASK_DEBUG = "False"
PYTHONUNBUFFERED = "1"
