[build]
# Dockerfile con la imagen oficial de Playwright (Chromium + deps ya listos).
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Start command robusto (Railway lo ejecuta SIN shell):
#  - sin `cd` (builtin de shell) → usamos gunicorn --chdir backend
#  - sin `$PORT` (no se expande sin shell) → gunicorn.conf.py lee PORT en Python
startCommand = "gunicorn --chdir backend -c backend/gunicorn.conf.py app:app"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[environment]
FLASK_ENV = "production"
FLASK_DEBUG = "False"
PYTHONUNBUFFERED = "1"
