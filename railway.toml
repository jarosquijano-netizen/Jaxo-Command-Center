[build]
builder = "NIXPACKS"

[deploy]
# 1 worker (varios hilos): el job store de Mercadona vive en memoria del proceso;
# con >1 worker, el POST /sync y el GET /job caen en procesos distintos → "Job no encontrado".
startCommand = "cd backend && gunicorn --bind 0.0.0.0:$PORT --workers 1 --timeout 600 --worker-class gthread --threads 8 app:app"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[environment]
FLASK_ENV = "production"
FLASK_DEBUG = "False"
PYTHONUNBUFFERED = "1"
# Chromium de Playwright (instalado en el build en esta ruta)
PLAYWRIGHT_BROWSERS_PATH = "/opt/pw-browsers"
