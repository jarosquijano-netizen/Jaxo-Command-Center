<svg width="600" height="150" viewBox="0 0 600 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="emblem_grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Emblem: Stylized X Hub -->
  <g transform="translate(20, 25)">
    <!-- Glassy Connector Lines -->
    <path d="M15 15 L45 45 M85 15 L55 45 M15 85 L45 55 M85 85 L55 55" stroke="url(#emblem_grad)" stroke-width="10" stroke-linecap="round" opacity="0.6" />
    <!-- Center Node -->
    <rect x="35" y="35" width="30" height="30" rx="8" fill="url(#emblem_grad)" filter="url(#glow)"/>
    <circle cx="50" cy="50" r="4" fill="white" />
    <!-- Outer Nodes -->
    <circle cx="15" cy="15" r="5" fill="#2dd4bf" filter="url(#glow)"/>
    <circle cx="85" cy="15" r="5" fill="#3b82f6" filter="url(#glow)"/>
    <circle cx="15" cy="85" r="5" fill="#3b82f6" filter="url(#glow)"/>
    <circle cx="85" cy="85" r="5" fill="#2dd4bf" filter="url(#glow)"/>
  </g>

  <!-- Typography -->
  <g transform="translate(140, 85)">
    <text font-family="Inter, sans-serif" font-weight="900" font-size="72" fill="white" letter-spacing="-2">
      JAX<tspan fill="#3b82f6">o</tspan>
    </text>
    <text y="40" font-family="Inter, sans-serif" font-weight="600" font-size="18" fill="#94a3b8" letter-spacing="6">
      COMMAND CENTER
    </text>
  </g>
</svg>