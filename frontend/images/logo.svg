<svg width="400" height="100" viewBox="0 0 400 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Definition for Glassmorphic Glows and Gradients -->
  <defs>
    <linearGradient id="logo_grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Geometric 'X' Emblem -->
  <g transform="translate(10, 10)">
    <!-- Main Hub Node -->
    <rect x="25" y="25" width="30" height="30" rx="6" fill="url(#logo_grad)" opacity="0.9" filter="url(#glow)"/>
    <!-- Interconnecting Arms -->
    <path d="M10 10 L30 30 M70 10 L50 30 M10 70 L30 50 M70 70 L50 50" stroke="url(#logo_grad)" stroke-width="8" stroke-linecap="round" opacity="0.8" />
    <!-- Center Dot -->
    <circle cx="40" cy="40" r="4" fill="white" />
  </g>

  <!-- Typography: JAXo -->
  <text x="100" y="55" font-family="Inter, sans-serif" font-weight="900" font-size="48" fill="white" letter-spacing="-1.5">
    JAX<tspan fill="#3b82f6">o</tspan>
  </text>
  
  <!-- Sub-brand: COMMAND CENTER -->
  <text x="102" y="82" font-family="Inter, sans-serif" font-weight="600" font-size="14" fill="#94a3b8" letter-spacing="4">
    COMMAND CENTER
  </text>
</svg>